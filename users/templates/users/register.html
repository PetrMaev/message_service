{% extends 'mailing_service/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="mb-5">
    <p class="text-center h1">Регистрация</p>
</div>
<div class="row">
    <div class="col-3"></div>
    <div class="col-6">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'mailing_service/base.html' %}

{% block title %}Статистика{% endblock %}

{% block content %}
<div class="mb-5">
    <p class="text-center h1">Статистика</p>
</div>
<table class="table table-striped">
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Дата и время попытки</th>
        <th scope="col">Статус</th>
        <th scope="col">Владелец</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <th scope="row">{{ attempt.id }}</th>
        <td>{{ attempt.date }}</td>
        <td>{{ attempt.status }}</td>
        <td>{{ attempt.owner }}</td>
    </tr>
    </tbody>
</table>
<div class="card-footer bg-transparent border-success">
    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <a href="{% url 'mailing_service:attempt_list' %}">
            <button type="button" class="btn btn-primary">Назад</button>
        </a>
    </div>
</div>

{% endblock %}
